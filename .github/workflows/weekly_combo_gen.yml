name: 주간 다음회차 조합 생성 (방문자 무관)

# 2026-09-27 신규 — "일요일 14시 생성이 앱 방문(=UptimeRobot 핑)에 묶여 있다"는
# 구멍을 없앤다. 스크립트 자체는 이미 방문자와 무관하게 돌 수 있게 만들어져 있고
# (회차 이력·필터 규칙을 전부 Turso DB에서 읽고, 결과도 DB에 적재), 이 워크플로가
# 그 실행을 GitHub Actions의 스케줄러에 얹는다.
#
# 왜 13:30 KST(=04:30 UTC)인가:
#   앱 안의 기존 트리거(combo_gen_trigger)는 일요일 14:00~14:59에 방문이 있을 때만
#   돈다. 여기서 14:00에 맞춰 돌리면 두 실행이 겹쳐 같은 회차를 동시에 생성하려
#   할 수 있다(워커는 삽입 직전에 "이미 있으면 스킵"으로 막지만, 동시에 통과할
#   여지를 아예 없애는 편이 안전하다). 30분 앞서 돌리면 앱 트리거는 항상
#   "이미 생성됨 → 스킵"만 하게 된다.
#   → 즉 이 워크플로가 주 경로, 앱 트리거는 Actions가 실패했을 때의 예비 경로다.

on:
  schedule:
    # 매주 일요일 04:30 UTC = 13:30 KST
    - cron: "30 4 * * 0"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    # 정상 실행은 3~5분(4차 필터 1,028,408개 계산 실측 149~157초 + 적재).
    # 앞선 조사에서 실행이 몇 시간 "진행 중"으로 남는 사례(db_turso의 non-daemon
    # 스레드)가 있었으므로 상한을 둔다 — hourly_draw_sync.py는 os._exit()로
    # 근본 수정했고 이 워커도 같은 방식이 필요하면 별도로 다룬다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        # combo_gen_worker는 db_turso(→ streamlit import)를 거치므로 requirements
        # 전체를 설치해 실제 import 체인과 항상 일치시킨다(시간별 동기화 워크플로와 동일).
        run: pip install -r requirements.txt

      - name: 다음회차 조합 생성 (combo_gen_worker.py)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python combo_gen_worker.py

      - name: 결과 상태 출력 (로그용)
        if: always()
        run: |
          echo "── combo_gen_job.status ──"
          python - <<'PY'
          import json, os
          p = "combo_gen_job.status"
          if os.path.exists(p):
              print(json.dumps(json.load(open(p, encoding="utf-8")), ensure_ascii=False, indent=2))
          else:
              print("상태 파일이 없습니다(워커가 시작 전에 죽었을 수 있음)")
          PY
