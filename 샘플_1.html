<style>
@keyframes wevIn {
  from { opacity: 0; transform: translateY(10px) scale(.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes wevFall {
  0%   { opacity: 0; transform: translateY(-14px) rotate(0deg) scale(.7); }
  18%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(190px) rotate(var(--r)) scale(1); }
}
@keyframes wevTwinkle {
  0%,100% { opacity: .25; } 50% { opacity: 1; }
}


@keyframes wevShine {
  0%   { transform: translateX(-130%) rotate(18deg); opacity: 0; }
  22%  { opacity: .95; }
  60%  { opacity: 0; }
  100% { transform: translateX(130%) rotate(18deg); opacity: 0; }
}
.wev-shine { animation: wevShine 1.5s ease-out .35s 1 both; }

.wev-wrap {
  position: relative;
  padding: 3px;
  border-radius: 20px;
  background: linear-gradient(135deg, #ffd66b 0%, #b8860b 45%, #ffe9a8 100%);
  box-shadow: 0 0 0 1px rgba(255,214,107,.25), 0 18px 48px rgba(0,0,0,.6);
  animation: wevIn .38s cubic-bezier(.2,.8,.3,1.15) both;
  overflow: hidden;
}
.wev-card {
  position: relative;
  border-radius: 18px;
  padding: 20px 18px 16px;
  background: radial-gradient(120% 130% at 50% -20%, #2a2416 0%, #14121a 55%, #0d0d12 100%);
  text-align: center;
  color: #f2f2f6;
  overflow: hidden;
}
.wev-shine {
  position: absolute; top: -60%; left: 0; width: 45%; height: 220%;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);
  pointer-events: none;
}
.wev-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.wev-p {
  position: absolute; top: 0; left: var(--x);
  width: 7px; height: 11px; border-radius: 2px;
  background: #ffd66b;
  opacity: 0;
  animation: wevFall 1.4s ease-in var(--d) 1 both, wevTwinkle 1.2s ease-in-out var(--d) 1 both;
}
@keyframes wevSamplePulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.wev-sample {
  font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: #ffffff; background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 6px; padding: 2px 8px;
  display: inline-block; margin-bottom: 10px;
  animation: wevSamplePulse 1.6s ease-in-out infinite;
}
.wev-badges, .wev-badge { /* 등수 뱃지는 2026-10-04 확정으로 제거(등수는 문구 한 줄로만) */ display: none !important; }
.wev-title {
  font-size: 19px; font-weight: 900; letter-spacing: -0.6px;
  color: #ffe9a8;
  margin: 2px 0 8px;
}
.wev-head { font-size: 13px; color: #c8c8d2; margin-bottom: 10px; }
.wev-head b { color: #ffffff; }
.wev-ranks {
  font-size: 15px; font-weight: 800; letter-spacing: -0.4px;
  color: #ffffff; line-height: 1.5;
}
.wev-note { margin-top: 10px; font-size: 11.5px; color: #9a9aa6; line-height: 1.5; }
.wev-sample {
</style>
<div class="wev-wrap">
  <div class="wev-card">
    <div class="wev-shine"></div>
    <div class="wev-particles" aria-hidden="true"><span class="wev-p" style="--i:0; --x:8%; --d:0.1s; --r:0deg"></span><span class="wev-p" style="--i:1; --x:15%; --d:0.26s; --r:37deg"></span><span class="wev-p" style="--i:2; --x:22%; --d:0.42000000000000004s; --r:74deg"></span><span class="wev-p" style="--i:3; --x:29%; --d:0.58s; --r:111deg"></span><span class="wev-p" style="--i:4; --x:36%; --d:0.74s; --r:148deg"></span><span class="wev-p" style="--i:5; --x:43%; --d:0.1s; --r:185deg"></span><span class="wev-p" style="--i:6; --x:50%; --d:0.26s; --r:222deg"></span><span class="wev-p" style="--i:7; --x:57%; --d:0.42000000000000004s; --r:259deg"></span><span class="wev-p" style="--i:8; --x:64%; --d:0.58s; --r:296deg"></span><span class="wev-p" style="--i:9; --x:71%; --d:0.74s; --r:333deg"></span></div>
    
    <div class="wev-title">🏆 1244회차 결과 — 2등 배출</div>
    <div class="wev-head">필터 통과 조합 기준</div>
    <div class="wev-ranks">2등 1개 · 3등 18개</div>
  </div>
</div>

    <div class="sample-btns">
      <button class="sample-btn" type="button">다시 보지 않기</button>
      <button class="sample-btn primary" type="button">확인</button>
    </div>
    <div class="sample-foot">
      · 문구는 확정 문구 그대로입니다 — 배출 등수만 간략 표기, 조합수량·군말 없음.<br>
      · 버튼은 실제 모달과 같은 자리·같은 규격입니다(이 샘플 파일에서는 동작하지 않습니다).<br>
      · 애니메이션은 페이지를 열 때 1회 재생됩니다 — 다시 보려면 새로고침하세요.
    </div>
  </div>
