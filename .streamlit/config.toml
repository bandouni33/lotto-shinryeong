[theme]
primaryColor = "#6C3CE0"
backgroundColor = "#FAF8FF"
secondaryBackgroundColor = "#F3EEFF"
textColor = "#1F1A2E"
font = "sans serif"

[server]
# 외부(모바일) 접속 허용 — localhost만 쓸 때는 127.0.0.1 로 변경 가능
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 5

# 2026-10-04 (동시접속 확장 3단계): 웹소켓이 끊긴 세션을 서버가 붙들고 있는 시간(초).
# Streamlit 기본값은 120초 — 모바일은 화면을 벗어나면 웹소켓이 끊기므로, 2분 안에
# 돌아오지 못하면 세션을 새로 만들어야 했다(재렌더·재조회 비용). 300초로 올린다.
# 대가: 끊긴 세션의 메모리를 최대 3분 더 보유한다(실측 세션당 약 3.2MB).
# 되돌리기: 이 줄을 지우면 기본값 120으로 돌아간다. 적용에는 서버 재시작이 필요하다.
disconnectedSessionTTL = 300

[browser]
gatherUsageStats = false
# 외부 IP 접속: run_server.ps1 이 --browser.serverAddress / serverPort 를 덮어씀.
# Streamlit Cloud(lotto-shinryeong.streamlit.app)에서는 serverAddress 를 두면 WebSocket 이 깨집니다.

[client]
showErrorDetails = false
toolbarMode = "minimal"
