[theme]
primaryColor = "#6C3CE0"
backgroundColor = "#FAF8FF"
secondaryBackgroundColor = "#F3EEFF"
textColor = "#1F1A2E"
font = "sans serif"

[server]
# 외부(모바일) 접속 허용 — localhost만 쓸 때는 127.0.0.1 로 변경 가능
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 5

# 웹소켓이 끊긴 세션을 서버가 붙들고 있는 시간(초). Streamlit 기본값도 120이다.
# 2026-10-04 이력: 3단계에서 300으로 올렸다가 **같은 날 120으로 되돌렸다** — 이 값은
# 저장소 파일이라 Cloud(2 vCPU/2.7GB 고정)가 재배포 때 그대로 읽는데, "Cloud가 세션을
# 3분 더 보유한 메모리를 감당하는지"를 우리가 확인할 수단이 없기 때문이다(운영 DB 공유가
# 확인돼 실제 사용자에게 적용되는 변경이었다). 상한을 다시 올릴 때 함께 재검토한다.
#   근거·경위: Cloud_공유DB_확인_상한롤백_2026-10-04.txt / 동시접속확장_3단계_TTL300_....txt
# 되돌리기: 이 줄을 지우면(또는 값 변경) 기본값으로 돌아간다. 적용에는 서버 재시작이 필요하다.
disconnectedSessionTTL = 120

[browser]
gatherUsageStats = false
# 외부 IP 접속: run_server.ps1 이 --browser.serverAddress / serverPort 를 덮어씀.
# Streamlit Cloud(lotto-shinryeong.streamlit.app)에서는 serverAddress 를 두면 WebSocket 이 깨집니다.

[client]
showErrorDetails = false
toolbarMode = "minimal"
