<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1035"/>
      <stop offset="55%" stop-color="#2a1550"/>
      <stop offset="100%" stop-color="#140b28"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f4d9a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f4d9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e2ad"/>
      <stop offset="100%" stop-color="#c99a4c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="300" height="500" rx="18" fill="url(#bg)"/>
  <rect x="10" y="10" width="280" height="480" rx="12" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="17" y="17" width="266" height="466" rx="8" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>

  <circle cx="150" cy="210" r="150" fill="url(#glow)"/>

  <!-- outer mandala ring -->
  <circle cx="150" cy="210" r="92" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.85"/>
  <circle cx="150" cy="210" r="76" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>

  <!-- crescent moon -->
  <path d="M150 140 A70 70 0 1 0 150 280 A55 55 0 1 1 150 140 Z" fill="url(#gold)" opacity="0.9"/>

  <!-- radiating star lines -->
  <g stroke="url(#gold)" stroke-width="1" opacity="0.55">
    <line x1="150" y1="118" x2="150" y2="98"/>
    <line x1="150" y1="302" x2="150" y2="322"/>
    <line x1="58" y1="210" x2="38" y2="210"/>
    <line x1="242" y1="210" x2="262" y2="210"/>
    <line x1="85" y1="145" x2="70" y2="130"/>
    <line x1="215" y1="145" x2="230" y2="130"/>
    <line x1="85" y1="275" x2="70" y2="290"/>
    <line x1="215" y1="275" x2="230" y2="290"/>
  </g>

  <!-- small stars scattered -->
  <g fill="url(#gold)">
    <path d="M150 92 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
    <path d="M64 140 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 z"/>
    <path d="M236 140 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 z"/>
    <path d="M64 280 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 z"/>
    <path d="M236 280 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 z"/>
    <path d="M150 328 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 z"/>
  </g>

  <!-- corner flourishes -->
  <g stroke="url(#gold)" stroke-width="1" fill="none" opacity="0.7">
    <path d="M30 30 q0 20 20 20"/>
    <path d="M270 30 q0 20 -20 20"/>
    <path d="M30 470 q0 -20 20 -20"/>
    <path d="M270 470 q0 -20 -20 -20"/>
  </g>

  <!-- bottom small motif -->
  <g fill="url(#gold)" opacity="0.85">
    <circle cx="150" cy="430" r="4"/>
    <circle cx="132" cy="430" r="2.2"/>
    <circle cx="168" cy="430" r="2.2"/>
  </g>
</svg>
