<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
</style></head>
<body>
<style>
@keyframes wevIn {
  from { opacity: 0; transform: translateY(10px) scale(.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes wevFall {
  0%   { opacity: 0; transform: translateY(-14px) rotate(0deg) scale(.7); }
  18%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(190px) rotate(var(--r)) scale(1); }
}
@keyframes wevTwinkle {
  0%,100% { opacity: .25; } 50% { opacity: 1; }
}
@keyframes wevPulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35)} }.wev-card{animation: wevIn .38s cubic-bezier(.2,.8,.3,1.15) both, wevPulse 2.6s ease-in-out .5s 2;}

@keyframes wevShine {
  0%   { transform: translateX(-150%) rotate(18deg) scaleY(1.15); opacity: 0; }
  10%  { opacity: 1; }
  45%  { opacity: 1; }
  62%  { opacity: 0; }
  100% { transform: translateX(150%) rotate(18deg) scaleY(1.15); opacity: 0; }
}
/* 2026-10-04 지시: 모바일에서 사선이 잘 안 보인다 → 더 밝게/넓게 + 창이 닫힐 때까지 계속. */
.wev-shine { animation: wevShine 2.8s cubic-bezier(.4,0,.6,1) .3s infinite; }

.wev-wrap {
  position: relative;
  padding: 2px;
  border-radius: 16px;
  background: linear-gradient(135deg, #4ff0ff 0%, #8a5cff 50%, #ff5cf0 100%);
  box-shadow: 0 0 28px rgba(79,240,255,.45), 0 0 60px rgba(138,92,255,.35);
  animation: wevIn .38s cubic-bezier(.2,.8,.3,1.15) both;
  overflow: hidden;
}
.wev-card {
  position: relative;
  border-radius: 14px;
  padding: 12px 14px 10px;
  background: radial-gradient(120% 130% at 50% -20%, #102033 0%, #0b1020 55%, #07070f 100%);
  text-align: center;
  color: #f2f2f6;
  overflow: hidden;
}
.wev-shine {
  position: absolute; top: -70%; left: -20%; width: 70%; height: 260%;
  background: linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.38) 38%,
      rgba(255,255,255,.98) 50%,
      rgba(255,255,255,.38) 62%,
      rgba(255,255,255,0) 100%);
  filter: blur(1px);
  mix-blend-mode: screen;
  will-change: transform, opacity;
  pointer-events: none;
}
.wev-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.wev-p {
  position: absolute; top: 0; left: var(--x);
  width: 7px; height: 11px; border-radius: 2px;
  background: #4ff0ff;
  opacity: 0;
  animation: wevFall 1.4s ease-in var(--d) 1 both, wevTwinkle 1.2s ease-in-out var(--d) 1 both;
}
@keyframes wevSamplePulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.wev-sample {
  font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: #ffffff; background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 6px; padding: 2px 8px;
  display: inline-block; margin-bottom: 10px;
  animation: wevSamplePulse 1.6s ease-in-out infinite;
}
.wev-badges, .wev-badge { /* 등수 뱃지는 2026-10-04 확정으로 제거(등수는 문구 한 줄로만) */ display: none !important; }
.wev-title {
  font-size: 17px; font-weight: 900; letter-spacing: -0.6px;
  color: #c8f9ff;
  margin: 0 0 5px;
}
.wev-head { font-size: 12px; color: #c8c8d2; margin-bottom: 6px; }
.wev-head b { color: #ffffff; }
.wev-ranks {
  font-size: 14.5px; font-weight: 800; letter-spacing: -0.4px;
  color: #ffffff; line-height: 1.35;
}
.wev-note { margin-top: 10px; font-size: 11.5px; color: #9a9aa6; line-height: 1.5; }
.wev-sample {
</style>
<div class="wev-wrap">
  <div class="wev-card">
    <div class="wev-shine"></div>
    
    
    <div class="wev-title">🏆 1244회차 결과 — 2등 배출</div>
    <div class="wev-head">필터 통과 조합 기준</div>
    <div class="wev-ranks">2등 1개 · 3등 18개</div>
  </div>
</div>

<script>
(function () {
  function report() {
    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 1;
    window.parent.postMessage({type: "streamlit:setFrameHeight", height: h}, "*");
  }
  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) { new ResizeObserver(report).observe(document.body); }
})();
</script>
</body></html>
