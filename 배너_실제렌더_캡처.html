<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
</style></head>
<body>
<style>
@keyframes wevIn {
  from { opacity: 0; transform: translateY(10px) scale(.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes wevFall {
  0%   { opacity: 0; transform: translateY(-18px) rotate(0deg) scale(.65); }
  12%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(300px) rotate(var(--r)) scale(1); }
}
@keyframes wevTwinkle {
  0%,100% { opacity: .25; } 50% { opacity: 1; }
}
@keyframes wevPulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35)} }.wev-card{animation: wevIn .38s cubic-bezier(.2,.8,.3,1.15) both, wevPulse 2.6s ease-in-out .5s 2;}

@keyframes wevShine {
  0%   { transform: translateX(-190%) rotate(18deg) scaleY(1.15); opacity: 0; }
  6%   { opacity: 1; }
  88%  { opacity: 1; }
  100% { transform: translateX(230%) rotate(18deg) scaleY(1.15); opacity: 0; }
}
/* 2026-10-04 지시: 모바일에서 사선이 잘 안 보인다 → 더 밝게/넓게 + 창이 닫힐 때까지 계속.
   또 한 번 지시: 중간에서 사라진다 → 카드 **오른쪽 끝을 지나서** 퇴장하도록 범위 확대
   (-190% → 230%). 불투명도는 88%까지 유지하고 마지막에만 0으로 줄인다. */
.wev-shine { animation: wevShine 3.4s cubic-bezier(.4,0,.6,1) .3s infinite; }

.wev-wrap {
  position: relative;
  padding: 2px;
  border-radius: 16px;
  background: linear-gradient(135deg, #4ff0ff 0%, #8a5cff 50%, #ff5cf0 100%);
  box-shadow: 0 0 28px rgba(79,240,255,.45), 0 0 60px rgba(138,92,255,.35);
  animation: wevIn .38s cubic-bezier(.2,.8,.3,1.15) both;
  overflow: hidden;
}
.wev-card {
  position: relative;
  border-radius: 14px;
  padding: 12px 14px 10px;
  background: radial-gradient(120% 130% at 50% -20%, #102033 0%, #0b1020 55%, #07070f 100%);
  text-align: center;
  color: #f2f2f6;
  overflow: hidden;
}
.wev-shine {
  position: absolute; top: -70%; left: -20%; width: 70%; height: 260%;
  background: linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.38) 38%,
      rgba(255,255,255,.98) 50%,
      rgba(255,255,255,.38) 62%,
      rgba(255,255,255,0) 100%);
  filter: blur(1px);
  mix-blend-mode: screen;
  will-change: transform, opacity;
  pointer-events: none;
}
.wev-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.wev-p {
  position: absolute; top: -6px; left: var(--x);
  width: 7px; height: 11px; border-radius: 2px;
  background: var(--c);
  opacity: 0;
  animation: wevFall 2.6s linear var(--d) infinite, wevTwinkle 1.3s ease-in-out var(--d) infinite;
}
@keyframes wevSamplePulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.wev-sample {
  font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: #ffffff; background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 6px; padding: 2px 8px;
  display: inline-block; margin-bottom: 10px;
  animation: wevSamplePulse 1.6s ease-in-out infinite;
}
.wev-badges, .wev-badge { /* 등수 뱃지는 2026-10-04 확정으로 제거(등수는 문구 한 줄로만) */ display: none !important; }
.wev-title {
  font-size: 17px; font-weight: 900; letter-spacing: -0.6px;
  color: #c8f9ff;
  margin: 0 0 5px;
}
.wev-head { font-size: 12px; color: #c8c8d2; margin-bottom: 6px; }
.wev-head b { color: #ffffff; }
.wev-ranks {
  font-size: 14.5px; font-weight: 800; letter-spacing: -0.4px;
  color: #ffffff; line-height: 1.35;
}
.wev-note { margin-top: 10px; font-size: 11.5px; color: #9a9aa6; line-height: 1.5; }
.wev-sample {
</style>
<div class="wev-wrap">
  <div class="wev-card">
    <div class="wev-shine"></div>
    <div class="wev-particles" aria-hidden="true"><span class="wev-p" style="--i:0; --x:4%; --d:0.0s; --r:0deg; --c:#4ff0ff"></span><span class="wev-p" style="--i:1; --x:11%; --d:0.19s; --r:47deg; --c:#ff5cf0"></span><span class="wev-p" style="--i:2; --x:18%; --d:0.38s; --r:94deg; --c:#8a5cff"></span><span class="wev-p" style="--i:3; --x:25%; --d:0.57s; --r:141deg; --c:#ffd66b"></span><span class="wev-p" style="--i:4; --x:32%; --d:0.76s; --r:188deg; --c:#7cff9b"></span><span class="wev-p" style="--i:5; --x:39%; --d:0.95s; --r:235deg; --c:#4ff0ff"></span><span class="wev-p" style="--i:6; --x:46%; --d:1.14s; --r:282deg; --c:#ff5cf0"></span><span class="wev-p" style="--i:7; --x:53%; --d:1.33s; --r:329deg; --c:#8a5cff"></span><span class="wev-p" style="--i:8; --x:60%; --d:1.52s; --r:16deg; --c:#ffd66b"></span><span class="wev-p" style="--i:9; --x:67%; --d:1.71s; --r:63deg; --c:#7cff9b"></span><span class="wev-p" style="--i:10; --x:74%; --d:1.9s; --r:110deg; --c:#4ff0ff"></span><span class="wev-p" style="--i:11; --x:81%; --d:2.09s; --r:157deg; --c:#ff5cf0"></span><span class="wev-p" style="--i:12; --x:88%; --d:2.28s; --r:204deg; --c:#8a5cff"></span><span class="wev-p" style="--i:13; --x:95%; --d:2.47s; --r:251deg; --c:#ffd66b"></span></div>
    
    <div class="wev-title">🏆 1244회차 결과 — 2등 배출</div>
    <div class="wev-head">필터 통과 조합 기준</div>
    <div class="wev-ranks">2등 1개 · 3등 18개</div>
  </div>
</div>

<script>
(function () {
  function report() {
    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 1;
    window.parent.postMessage({type: "streamlit:setFrameHeight", height: h}, "*");
  }
  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) { new ResizeObserver(report).observe(document.body); }
})();
</script>
</body></html>
